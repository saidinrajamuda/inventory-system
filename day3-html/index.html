<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item - Inventory System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1e3a5f">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📦 Inventory</h2>
                <p>Compact II Gencon Inc.</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" data-role="admin-management">📊 Dashboard</a>
                <a href="index.html" class="active">📝 Add Item</a>
                <a href="items.html">📋 Item List</a>
                <a href="issue.html" data-role="admin-personnel">📤 Issue/Release</a>
                <a href="scan.html" data-role="admin-personnel">📱 Scan QR</a>
                <a href="discrepancies.html" data-role="admin-management">⚠️ Discrepancies</a>
                <a href="reports.html" data-role="admin-management">📈 Reports</a>
                <a href="users.html" data-role="admin">👥 Users</a>
                <a href="#" onclick="logout()" style="color: #e74c3c; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Add New Item</h1>
                <div class="user-info">
                    <span class="user-name">👤 Loading...</span>
                </div>
            </header>

            <section class="content-card" style="margin-bottom: 20px;" data-role="admin">
                <h2 id="formTitle">Add New Item</h2>
                <form>
                    <div class="form-grid">
                        <div>
                            <label for="itemName">Item Name:</label>
                            <input type="text" id="itemName" name="itemName" placeholder="e.g. Hammer" required>
                        </div>
                        <div>
                            <label for="uniqueCode">Unique Code:</label>
                            <input type="text" id="uniqueCode" name="uniqueCode" placeholder="e.g. TOOL-0001" required>
                        </div>
                        <div>
                            <label for="category">Category:</label>
                            <select id="category" name="category" required>
                                <option value="">-- Select Category --</option>
                                <option value="Equipment - Office">Equipment - Office</option>
                                <option value="Equipment - Site">Equipment - Site</option>
                                <option value="Tools - Hand Tools">Tools - Hand Tools</option>
                                <option value="Tools - Power Tools">Tools - Power Tools</option>
                                <option value="Machinery">Machinery</option>
                                <option value="Materials">Materials</option>
                                <option value="PPE (Personal Protective Equipment)">PPE (Personal Protective Equipment)</option>
                                <option value="Furniture & Fixtures">Furniture & Fixtures</option>
                                <option value="Vehicle">Vehicle</option>
                            </select>
                        </div>
                        <div>
                            <label for="brand">Brand:</label>
                            <input type="text" id="brand" name="brand" placeholder="e.g. Bosch">
                        </div>
                        <div>
                            <label for="quantity">Quantity:</label>
                            <input type="number" id="quantity" name="quantity" min="0" required>
                        </div>
                        <div>
                            <label for="unit">Unit:</label>
                            <select id="unit" name="unit">
                                <option value="pcs">pcs (pieces)</option>
                                <option value="box">box</option>
                                <option value="kg">kg (kilograms)</option>
                                <option value="m">m (meters)</option>
                                <option value="L">L (liters)</option>
                                <option value="set">set</option>
                                <option value="unit">unit</option>
                                <option value="length">length</option>
                                <option value="gal">gal</option>
                                <option value="tank">tank</option>
                            </select>
                        </div>
                        <div>
                            <label for="reorderLevel">Reorder Level:</label>
                            <input type="number" id="reorderLevel" name="reorderLevel" min="0" value="5" placeholder="e.g. 5">
                        </div>
                        <div>
                            <label for="warehouse">Warehouse:</label>
                            <select id="warehouse" name="warehouse">
                                <option value="">-- Select Warehouse --</option>
                            </select>
                        </div>
                        <div>
                            <label for="location">Location:</label>
                            <input type="text" id="location" name="location" placeholder="e.g. Shelf 1">
                        </div>
                        <div>
                            <label for="condition">Condition:</label>
                            <select id="condition" name="condition" required>
                                <option value="">-- Select Condition --</option>
                                <option value="Available">Available</option>
                                <option value="In Use">In Use</option>
                                <option value="Low Stock">Low Stock</option>
                                <option value="Out of Stock">Out of Stock</option>
                                <option value="For Maintenance">For Maintenance</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <button type="submit" id="submitBtn">Add Item</button>
                        <button type="button" id="cancelBtn" onclick="cancelEdit()" style="display: none; background-color: #999; margin-left: 8px;">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="content-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h2 style="margin: 0;">Item List</h2>
                    <div>
                        <input type="text" id="searchInAdd" onkeyup="filterItems()" placeholder="🔍 Search name or code..." style="padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 250px; font-size: 14px;">
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Unique Code</th>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Condition</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="itemsTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        });
    }
    </script>
</body>
</html>
