<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item List - Inventory System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1e3a5f">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📦 Inventory</h2>
                <p>Compact II Gencon Inc.</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="index.html">📝 Add Item</a>
                <a href="items.html" class="active">📋 Item List</a>
                <a href="issue.html">📤 Issue/Release</a>
                <a href="scan.html" data-role="not-management">📱 Scan QR</a>
                <a href="discrepancies.html">⚠️ Discrepancies</a>
                <a href="reports.html">📈 Reports</a>
                <a href="users.html" data-role="admin">👥 Users</a>
                <a href="#" onclick="logout()" style="color: #e74c3c; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Item List</h1>
                <div class="user-info">
                    <span class="user-name">👤 Loading...</span>
                </div>
            </header>

            <section class="content-card">
                <!-- SEARCH AND FILTER SECTION -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                    <h2 style="margin: 0;">📋 All Items</h2>
                    
                    <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                        <!-- SEARCH BAR -->
                        <div>
                            <input type="text" id="searchItem" onkeyup="filterItems()" placeholder="🔍 Search name or code..." style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 250px; font-size: 14px;">
                        </div>

                        <!-- SITE FILTER -->
                        <div>
                            <select id="filterSite" onchange="filterItems()" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;">
                                <option value="All">🌐 All Sites</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- TABLE -->
                <div style="overflow-x: auto;">
                    <table style="width: 100%; min-width: 800px;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Unique Code</th>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Qty</th>
                                <th>Condition</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="itemsTableBody">
                            <tr><td colspan="7" style="text-align:center;padding:20px;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="items.js"></script>
    
    <!-- PWA SERVICE WORKER -->
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("✅ SW registered"))
                .catch((err) => console.warn("SW failed:", err));
        });
    }
    </script>
</body>
</html>
