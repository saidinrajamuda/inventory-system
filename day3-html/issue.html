<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue / Release - Inventory System</title>
    
    <!-- PWA LINKS -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1e3a5f">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📦 Inventory</h2>
                <p>Compact II Gencon Inc.</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="index.html">📝 Add Item</a>
                <a href="items.html">📋 Item List</a>
                <a href="issue.html" class="active">📤 Issue/Release</a>
                <a href="scan.html" data-role="not-management">📱 Scan QR</a>
                <a href="discrepancies.html">⚠️ Discrepancies</a>
                <a href="reports.html">📈 Reports</a>
                <a href="users.html" data-role="admin">👥 Users</a>
                <a href="#" onclick="logout()" style="color: #e74c3c; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Issue / Release Items</h1>
                <div class="user-info">
                    <span class="user-name">👤 Loading...</span>
                </div>
            </header>

            <section class="content-card" data-role="admin-personnel" style="margin-bottom: 20px;">
                <h2>📝 New Request</h2>
                <form id="requestForm">
                    <!-- Ginamit natin ang form-grid para maging 2 columns -->
                    <div class="form-grid">
                        <div>
                            <label for="reqItem">Select Item:</label>
                            <select id="reqItem" required>
                                <option value="">-- Select Item --</option>
                            </select>
                        </div>

                        <div>
                            <label for="reqQty">Quantity:</label>
                            <input type="number" id="reqQty" min="1" required>
                        </div>

                        <div>
                            <label for="reqPurpose">Purpose:</label>
                            <input type="text" id="reqPurpose" placeholder="e.g. Site construction">
                        </div>

                        <div>
                            <label for="reqSite">Project / Site:</label>
                            <input type="text" id="reqSite" placeholder="e.g. Project Alpha">
                        </div>

                        <div>
                            <label for="reqBy">Requested By:</label>
                            <input type="text" id="reqBy" required>
                        </div>

                        <div>
                            <label for="reqNotes">Notes:</label>
                            <textarea id="reqNotes" rows="2" placeholder="Additional details..."></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <button type="submit" style="background-color: #27ae60;">Submit Request</button>
                    </div>
                </form>
            </section>

            <section class="content-card">
                <h2>📋 Request History</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Requested By</th>
                                <th>Purpose / Site</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody">
                            <tr><td colspan="7" style="text-align: center; padding: 20px;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="issue.js"></script>

    <!-- PWA SERVICE WORKER -->
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("✅ SW registered"))
                .catch((err) => console.warn("SW failed:", err));
        });
    }
    </script>
</body>
</html>
