<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Inventory System</title>
    
    <!-- PWA LINKS -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1e3a5f">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📦 Inventory</h2>
                <p>Compact II Gencon Inc.</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="index.html">📝 Add Item</a>
                <a href="#">📋 Item List</a>
                <a href="issue.html">📤 Issue/Release</a>
                <a href="scan.html" data-role="not-management">📱 Scan QR</a>
                <a href="discrepancies.html">⚠️ Discrepancies</a>
                <a href="reports.html" class="active">📈 Reports</a>
                <a href="users.html" data-role="admin">👥 Users</a>
                <a href="#" onclick="logout()" style="color: #e74c3c; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Reports</h1>
                <div class="user-info">
                    <span class="user-name">👤 Loading...</span>
                </div>
            </header>

            <section class="content-card" style="margin-bottom: 20px;">
                <h2>🔍 Filter Verifications</h2>
                <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-top: 15px;">
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px;">Status:</label>
                        <select id="filterStatus" style="padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                            <option value="All">All Status</option>
                            <option value="Matched">Matched Only</option>
                            <option value="Discrepancy">Discrepancy Only</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px;">Date From:</label>
                        <input type="date" id="filterDateFrom" style="padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px;">Date To:</label>
                        <input type="date" id="filterDateTo" style="padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div>
                        <button onclick="applyFilters()" class="btn-start" style="padding: 8px 20px; margin: 0;">Apply Filters</button>
                        <button onclick="resetFilters()" class="btn-back" style="display: inline-block; margin: 0 0 0 5px; padding: 8px 20px; width: auto;">Reset</button>
                    </div>
                </div>
            </section>

            <section class="content-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h2 style="margin: 0;">📋 Verification Records</h2>
                    <div>
                        <button onclick="exportToCSV()" class="btn-start" style="padding: 8px 20px; margin: 0; font-size: 13px;">📥 Export CSV</button>
                        <button onclick="printReport()" class="btn-back" style="display: inline-block; margin: 0 0 0 5px; padding: 8px 20px; width: auto; font-size: 13px;">🖨️ Print</button>
                    </div>
                </div>

                <p id="reportSummary" style="color: #666; font-size: 14px; margin-bottom: 15px;"></p>

                <table id="reportsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Item Code</th>
                            <th>Item Name</th>
                            <th>Expected</th>
                            <th>Actual</th>
                            <th>Status</th>
                            <th>Verified By</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 20px; color: #999;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="reports.js"></script>

    <!-- PWA SERVICE WORKER -->
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("✅ SW registered"))
                .catch((err) => console.warn("SW failed:", err));
        });
    }
    </script>
</body>
</html>
