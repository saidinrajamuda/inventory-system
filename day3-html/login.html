<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory System</title>
    
    <!-- PWA LINKS -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1e3a5f">

    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
            padding: 20px;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo h1 {
            color: #1e3a5f;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .auth-logo p {
            color: #666;
            font-size: 13px;
        }
        .auth-form-group {
            margin-bottom: 18px;
        }
        .auth-form-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .auth-form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .auth-form-group input:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.15);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .auth-btn:hover {
            background: #2c5282;
        }
        .auth-error {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        .auth-link a {
            color: #1e3a5f;
            font-weight: 600;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo" style="text-align: center; margin-bottom: 30px;">
                <img src="logo.png" alt="Compact II Logo" style="max-width: 200px; max-height: 100px; object-fit: contain; margin-bottom: 15px;">
                <h1 style="font-size: 22px; margin-bottom: 5px; color: #1e3a5f;">Inventory System</h1>
                <p style="color: #666; font-size: 13px;">Compact II Gencon Inc.</p>
            </div>
            <div id="errorMsg" class="auth-error"></div>

            <form id="loginForm">
                <div class="auth-form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="auth-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="auth-btn">🔐 Sign In</button>
            </form>

            <div class="auth-link">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>
    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="mobile-nav-item">
            <span class="icon">📊</span>
            <span class="text">Home</span>
        </a>
        <a href="items.html" class="mobile-nav-item">
            <span class="icon">📋</span>
            <span class="text">Items</span>
        </a>
        <a href="scan.html" class="mobile-nav-item">
            <span class="icon">📱</span>
            <span class="text">Scan</span>
        </a>
        <a href="issue.html" class="mobile-nav-item">
            <span class="icon">📤</span>
            <span class="text">Issue</span>
        </a>
        <a href="#" onclick="logout()" class="mobile-nav-item" style="color: #e74c3c;">
            <span class="icon">🚪</span>
            <span class="text">Exit</span>
        </a>
    </nav>    
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>

    <!-- PWA SERVICE WORKER -->
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("✅ SW registered"))
                .catch((err) => console.warn("SW failed:", err));
        });
    }
    </script>
</body>
</html>
